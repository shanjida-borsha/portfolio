<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHANJIDA KHANOM BORSHA | Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0 !important;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #020617;
            color: #e5e7eb;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        header, section {
            padding: 80px 20px;
            background: #020617;
        }

        header {
            padding-top: 100px;
            background: radial-gradient(circle at top right, #1e293b, #020617);
        }

        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }

        /* ===== ANIMATIONS ===== */
        .reveal { 
            opacity: 0; 
            transition: all 2.0s cubic-bezier(0.2, 1, 0.3, 1);
        } 
        .slide-up { transform: translateY(50px); }
        .zoom-in { transform: scale(0.85); }
        .active { opacity: 1 !important; transform: translate(0) scale(1) !important; }

        .hero img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 6px solid #38bdf8;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
            margin-bottom: 20px !important;
            display: block;
            margin-left: auto !important;
            margin-right: auto !important;
        }

        .hero-text { text-align: center; }
        .designation { 
            font-family: 'Dancing Script', cursive; 
            color: #38bdf8; 
            font-size: 38px; 
            margin-bottom: 25px !important;
            display: block;
        }
        
        .cv-btn {
            padding: 14px 40px;
            background: #38bdf8;
            color: #020617;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            transition: 1.0s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== SKILLS & PROJECTS GRID ===== */
        .container { max-width: 1200px; margin: auto !important; }
        h2 { text-align: center; font-size: 40px; margin-bottom: 50px !important; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover { transform: translateY(-20px); }
        .exp-yt { background: linear-gradient(135deg, #ff0000, #b91c1c); }
        .exp-yt i { color: #ffffff !important; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6)); }

        /* ===== FULL WIDTH CONTACT SECTION ===== */
        .contact {
            width: 100%;
            padding: 100px 0 !important; /* Full edge-to-edge padding */
            background: #0f172a; /* Slightly different dark shade for section break */
        }

        .contact-full-wrapper {
            width: 100%;
            max-width: 100%; /* Removes side constraints */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-content {
            width: 90%;
            max-width: 800px; /* Limits the content for readability, but background stays full width */
            margin: 0 auto !important;
        }

        form { background: #020617; padding: 40px; border-radius: 20px; width: 100%; margin-bottom: 40px !important; }
        form input, form textarea {
            width: 100%; padding: 18px; margin-bottom: 20px !important;
            background: #0f172a; border: 2px solid #38bdf8; color: #fff; border-radius: 10px;
        }

        form button {
            width: 100%; padding: 18px; background: #38bdf8; border: none;
            font-weight: 700; border-radius: 10px; cursor: pointer;
        }

        .info-box {
            text-align: center;
            padding: 40px;
            width: 100%;
        }

        .contact-details p {
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px !important;
        }

        .social-links { display: flex; gap: 30px; justify-content: center; margin-top: 30px !important; }
        .social-links a { font-size: 35px; transition: 1.2s; display: inline-block; text-decoration: none; }
        .social-links a:hover { transform: translateY(-10px); filter: drop-shadow(0 0 10px currentColor); }

        .fa-linkedin { color: #0A66C2; }
        .fa-whatsapp { color: #25D366; }
        .fa-facebook { color: #1877F2; }
        .fa-youtube { color: #FF0000; }

        .map-container { 
            width: 100%; 
            height: 450px; 
            margin-top: 50px !important;
            border-top: 4px solid #38bdf8;
        }
        iframe { width: 100%; height: 100%; border: 0; }

        footer { padding: 40px; text-align: center; background: #010409; }
    </style>
</head>

<body>

<header>

        <img src="photo.png" alt="Shanjida Khanom Borsha">
        <div class="hero-text">
            <h1>SHANJIDA KHANOM BORSHA</h1>
            <span class="designation">Innovative Digital Marketer</span>

                <i class="fa-solid fa-file-arrow-down"></i> DOWNLOAD CV

<section id="contact" class="contact">
    <div class="contact-full-wrapper">

        <div class="contact-content reveal slide-up">
            <form action="https://formspree.io/f/xykzwdar" method="POST">
                <input type="text" name="name" placeholder="YOUR NAME" required>

                <textarea name="message" rows="5" placeholder="MESSAGE" required></textarea>
                <button type="submit">SEND MESSAGE</button>
            </form>

            <div class="info-box">
                <div class="contact-details">
                    <p><i class="fa-solid fa-phone"></i> +880 1741 798260</p>
                    <p><i class="fa-solid fa-location-dot"></i> Mohammadpur, Dhaka</p>
                    <p><i class="fa-solid fa-envelope"></i> <a href="mailto:shanjida.borsha1@gmail.com" style="color:white; text-decoration:none;">shanjida.borsha1@gmail.com</a></p>
                </div>
                
                <div class="social-links">
                    <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                    <a href="https://wa.me/8801741798260"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                </div>
            </div>
        </div>

        <div class="map-container reveal">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14607.602953335529!2d90.354117!3d23.750889!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755bf607068560d%3A0x7d00f7273f009d1!2sMohammadpur%2C%20Dhaka!5e0!3m2!1sen!2sbd!4v1700000000000"></iframe>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 SHANJIDA KHANOM BORSHA. ALL RIGHTS RESERVED.</p>
</footer>

<script>
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('active');
            }
        });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
