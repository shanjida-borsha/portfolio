<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Shanjida Khanom Borsha</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* CONSISTENT STYLING WITH MAIN PAGE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { 
            background: #020617; 
            background: radial-gradient(circle at top right, #1e293b, #020617);
            color: #e5e7eb; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        .thank-you-card {
            text-align: center;
            padding: 60px 40px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-box {
            width: 100px;
            height: 100px;
            background: rgba(56, 189, 248, 0.1);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            position: relative;
        }

        .icon-box i {
            font-size: 45px;
            color: #38bdf8;
            animation: checkGrow 0.8s ease-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            color: #fff;
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* CONSISTENT BUTTON STYLE */
        .btn-shared { 
            padding: 14px 40px; 
            background: #38bdf8; 
            color: #020617; 
            text-decoration: none; 
            font-weight: 700; 
            border-radius: 50px; 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 2px solid #38bdf8;
        }
        .btn-shared:hover { 
            background: transparent; 
            color: #38bdf8; 
            transform: translateY(-5px); 
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3); 
        }

        /* ANIMATIONS */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes checkGrow {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(0); }
            100% { transform: scale(1); opacity: 1; }
        }

        footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #475569;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <div class="icon-box">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1>Message Sent!</h1>
        <p>Thank you for reaching out, Shanjida. I have received your message and will get back to you within 24 hours.</p>
        
        <a href="index.html" class="btn-shared">
            <i class="fa-solid fa-arrow-left"></i> BACK TO PORTFOLIO
        </a>
    </div>

    <footer>
        © 2026 SHANJIDA KHANOM BORSHA. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>
