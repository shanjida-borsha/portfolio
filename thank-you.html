<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Shanjida Khanom Borsha</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { 
            background: #020617; 
            background: radial-gradient(circle at top right, #1e293b, #020617);
            color: #e5e7eb; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        .thank-you-card {
            text-align: center;
            padding: 60px 40px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(56, 189, 248, 0.1);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .icon-box i { font-size: 35px; color: #38bdf8; }

        h1 { font-family: 'Playfair Display', serif; font-size: 38px; color: #fff; margin-bottom: 15px; }
        p { color: #94a3b8; margin-bottom: 30px; line-height: 1.6; }

        .btn-shared { 
            padding: 12px 35px; 
            background: #38bdf8; 
            color: #020617; 
            text-decoration: none; 
            font-weight: 700; 
            border-radius: 50px; 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            transition: 0.3s;
            border: 2px solid #38bdf8;
        }
        .btn-shared:hover { background: transparent; color: #38bdf8; transform: translateY(-3px); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <div class="icon-box"><i class="fa-solid fa-paper-plane"></i></div>
        <h1>Successfully Sent!</h1>
        <p>Your message has reached my inbox. I usually respond within a few hours. Looking forward to our conversation!</p>
        <a href="index.html" class="btn-shared"><i class="fa-solid fa-house"></i> BACK TO HOME</a>
    </div>

</body>
</html>
