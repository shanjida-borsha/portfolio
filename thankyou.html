<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Shanjida Khanom Borsha</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Playfair+Display:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: #020617;
            color: #e5e7eb;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
            background: #0f172a;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.1);
            max-width: 500px;
        }
        i { font-size: 60px; color: #38bdf8; margin-bottom: 20px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 40px; margin-bottom: 10px; }
        p { font-size: 18px; color: #94a3b8; margin-bottom: 30px; }
        .back-btn {
            padding: 12px 30px;
            background: #38bdf8;
            color: #020617;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .back-btn:hover { background: #7dd3fc; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <i class="fa-solid fa-circle-check"></i>
        <h1>Message Received!</h1>
        <p>Thank you for reaching out, Shanjida. I have received your message and will get back to you shortly.</p>
        <a href="index.html" class="back-btn">Back to Portfolio</a>
    </div>
</body>
</html>
